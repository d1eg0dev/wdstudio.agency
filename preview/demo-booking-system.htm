<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserve — Casa Aurora</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2B28; --soft:#4F625D; --mute:#8D9A96;
  --line:#E4E7E4; --bone:#FAF9F6; --sand:#C7B199; --acc:#2F5D52;
  --sans:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --disp:'Cormorant Garamond',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bone);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:44px 26px 70px}

.demo{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--ink);color:#fff;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:8px 18px;text-align:center}
.demo b{color:var(--sand)}
.wrap{padding-top:70px}

h1{font-family:var(--disp);font-weight:300;font-size:38px;line-height:1.1;letter-spacing:-.01em}
h1 span{font-style:italic}
.sub{margin-top:10px;font-size:15px;color:var(--soft)}
.note{margin-top:8px;font-size:12.5px;color:var(--mute)}

/* pasos */
.steps{display:flex;gap:0;margin:30px 0 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.step{flex:1;display:flex;align-items:center;gap:10px;padding:16px 8px 16px 0}
.step.dim{opacity:.4}
.dot{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--mute);flex-shrink:0}
.dot.active{background:var(--ink);border-color:var(--ink);color:#fff}
.dot.done{background:var(--acc);border-color:var(--acc);color:#fff}
.stxt{font-size:12.5px;color:var(--mute);letter-spacing:.02em}
.stxt.b{color:var(--ink);font-weight:500}

/* calendario */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal-head h2{font-family:var(--disp);font-size:21px;font-weight:400}
.nav{display:flex;gap:6px}
.nav button{width:32px;height:32px;border:1px solid var(--line);background:#fff;cursor:pointer;
  font-size:14px;color:var(--soft);border-radius:2px;transition:all .2s}
.nav button:hover{border-color:var(--ink);color:var(--ink)}
.cal{background:#fff;border:1px solid var(--line);border-radius:3px;padding:18px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px}
.dow div{text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13.5px;cursor:pointer;border-radius:2px;position:relative;transition:background .15s}
.d.pad{cursor:default}
.d.out{color:#D5DAD8;cursor:default}
.d.booked{color:#C9908A;cursor:not-allowed;text-decoration:line-through;background:#FBF3F2}
.d:not(.pad):not(.out):not(.booked):hover{background:#F0F3F1}
.d.sel{background:var(--ink);color:#fff}
.d.range{background:#EAF0ED}
.d .p{font-size:9px;color:var(--mute);margin-top:1px}
.d.sel .p{color:rgba(255,255,255,.7)}

.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}

.seasons{margin-top:22px;border:1px solid var(--line);border-radius:3px;background:#fff;overflow:hidden}
.seasons .r{display:flex;justify-content:space-between;padding:12px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.seasons .r:last-child{border-bottom:none}
.seasons .r b{font-weight:500}
.seasons .r span{color:var(--soft)}
.seasons .r em{font-style:normal;color:var(--mute);font-size:11.5px}

/* extras */
.eh2{font-family:var(--disp);font-size:21px;font-weight:400;margin-bottom:5px}
.esub{font-size:13.5px;color:var(--soft);margin-bottom:20px}
.ex{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:3px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.ex:hover{border-color:var(--mute)}
.ex.on{border-color:var(--acc);background:#F7FAF8}
.ex .box{width:19px;height:19px;border:1px solid var(--line);border-radius:3px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.ex.on .box{background:var(--acc);border-color:var(--acc)}
.ex .t{flex:1}
.ex .t b{display:block;font-size:14.5px;font-weight:500}
.ex .t span{font-size:12.5px;color:var(--mute)}
.ex .pr{font-size:14px;font-weight:500;white-space:nowrap}

/* resumen */
.sum{background:#fff;border:1px solid var(--line);border-radius:3px;padding:20px 22px;margin-top:22px}
.sum .sh{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.sum .r{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px;color:var(--soft);border-bottom:1px solid var(--line)}
.sum .r b{color:var(--ink);font-weight:400}
.sum .r.tot{border-bottom:none;padding-top:16px;margin-top:6px;border-top:1px solid var(--ink);font-size:17px;color:var(--ink)}
.sum .r.tot b{font-weight:600}
.sum .r small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}

/* form */
.fld{margin-bottom:16px}
.lbl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:3px;background:#fff;
  padding:12px 14px;font-family:var(--sans);font-size:14.5px;font-weight:300;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.agree{display:flex;gap:11px;align-items:flex-start;margin-top:18px;font-size:12.5px;color:var(--soft);cursor:pointer}
.agree input{width:auto;margin-top:2px}
.agree a{color:var(--acc)}

/* botones */
.bn{display:flex;gap:10px;margin-top:26px}
.bp{flex:1;background:var(--ink);color:#fff;border:none;border-radius:3px;padding:16px;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.06em;transition:opacity .2s}
.bp:hover{opacity:.88}
.bp.dim{opacity:.35;cursor:not-allowed}
.bs{background:#fff;color:var(--soft);border:1px solid var(--line);border-radius:3px;
  padding:16px 26px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500}
.bs:hover{border-color:var(--ink);color:var(--ink)}

/* confirmación */
.ok{text-align:center;padding:52px 20px}
.ok .ic{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.ok h2{font-family:var(--disp);font-size:29px;font-weight:300;margin-bottom:10px}
.ok p{font-size:14.5px;color:var(--soft);max-width:38ch;margin:0 auto}
.ok .ref{margin-top:24px;display:inline-block;background:#fff;border:1px solid var(--line);
  border-radius:3px;padding:12px 22px;font-size:13px;letter-spacing:.06em}

.foot{margin-top:40px;text-align:center;font-size:11.5px;color:var(--mute);line-height:1.8}
.foot a{color:var(--acc)}
@media(max-width:620px){
  .wrap{padding:66px 18px 50px}
  h1{font-size:30px}
  .row2{grid-template-columns:1fr}
  .stxt{display:none}
  .step{flex:0 0 auto;padding-right:0;gap:0}
  .steps{gap:12px;justify-content:center}
}
</style>
</head>
<body>

<div class="demo">Interactive demo &nbsp;·&nbsp; <b>No real charges</b> &nbsp;·&nbsp; Built by WD Studio</div>

<div class="wrap" id="app"></div>

<script>
/* ---------- CONFIG ---------- */
var CFG = {
  property: 'Casa Aurora',
  currency: 'USD',
  seasons: [
    { name:'High season',  from:'2026-12-15', to:'2027-04-15', rate:980, min:5 },
    { name:'Mid season',   from:'2026-10-01', to:'2026-12-14', rate:720, min:3 },
    { name:'Green season', from:'2027-04-16', to:'2027-09-30', rate:540, min:2 }
  ],
  defaultRate: 720,
  defaultMin: 3,
  cleaning: 180,
  petFee: 35,
  addons: [
    { id:'transfer', name:'Airport transfer', desc:'Private round trip, up to 6 guests', price:240, per:'stay' },
    { id:'chef',     name:'Private chef',     desc:'Breakfast and dinner daily',        price:190, per:'night' },
    { id:'yoga',     name:'Morning yoga',     desc:'Private instructor on the terrace',  price:85,  per:'session' }
  ],
  booked: ['2026-12-24','2026-12-25','2026-12-26','2026-12-27','2026-12-28',
           '2027-01-02','2027-01-03','2027-01-04',
           '2027-02-14','2027-02-15','2027-02-16']
};

/* ---------- ESTADO ---------- */
var S = { step:0, m:11, y:2026, ci:null, co:null, guests:4, pets:0,
          addons:{}, name:'', email:'', phone:'', notes:'', agreed:false, done:false };

var MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DW = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function iso(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function f$(n){ return '$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function eH(s){ return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function seasonFor(d){
  for(var i=0;i<CFG.seasons.length;i++){ var s=CFG.seasons[i]; if(d>=s.from && d<=s.to) return s; }
  return { name:'Standard', rate:CFG.defaultRate, min:CFG.defaultMin };
}
function nights(){
  if(!S.ci||!S.co) return 0;
  return Math.round((new Date(S.co)-new Date(S.ci))/864e5);
}
function segments(){
  var out=[], d=new Date(S.ci), end=new Date(S.co);
  while(d<end){
    var k=d.toISOString().slice(0,10), s=seasonFor(k);
    var last=out[out.length-1];
    if(last && last.name===s.name) last.n++;
    else out.push({name:s.name, rate:s.rate, n:1});
    d.setDate(d.getDate()+1);
  }
  return out;
}
function lodging(){ return segments().reduce(function(a,s){return a+s.rate*s.n;},0); }
function addonsTotal(){
  var t=0, n=nights();
  CFG.addons.forEach(function(a){
    if(!S.addons[a.id]) return;
    t += a.per==='night' ? a.price*n : a.price;
  });
  return t;
}
function petsTotal(){ return S.pets * CFG.petFee * nights(); }
function total(){ return lodging() + CFG.cleaning + addonsTotal() + petsTotal(); }

function minOk(){
  if(!S.ci||!S.co) return true;
  var need = seasonFor(S.ci).min;
  return nights() >= need;
}

/* ---------- CALENDARIO ---------- */
function pick(k){
  if(CFG.booked.indexOf(k)>-1) return;
  if(!S.ci || (S.ci && S.co)) { S.ci=k; S.co=null; }
  else if(k<=S.ci) { S.ci=k; S.co=null; }
  else {
    var d=new Date(S.ci), end=new Date(k);
    while(d<end){ if(CFG.booked.indexOf(d.toISOString().slice(0,10))>-1){ S.ci=k; S.co=null; render(); return; } d.setDate(d.getDate()+1); }
    S.co=k;
  }
  render();
}
function shift(n){ S.m+=n; if(S.m>11){S.m=0;S.y++} if(S.m<0){S.m=11;S.y--} render(); }

function calHTML(){
  var first=new Date(S.y,S.m,1).getDay(), days=new Date(S.y,S.m+1,0).getDate();
  var h='<div class="cal-head"><h2>'+MN[S.m]+' '+S.y+'</h2><div class="nav">'
      + '<button onclick="shift(-1)">‹</button><button onclick="shift(1)">›</button></div></div>'
      + '<div class="cal"><div class="dow">'+DW.map(function(d){return '<div>'+d+'</div>'}).join('')+'</div><div class="grid">';
  for(var i=0;i<first;i++) h+='<div class="d pad"></div>';
  for(var d=1;d<=days;d++){
    var k=iso(S.y,S.m,d), c='d', s=seasonFor(k);
    if(CFG.booked.indexOf(k)>-1) c+=' booked';
    else if(k===S.ci||k===S.co) c+=' sel';
    else if(S.ci&&S.co&&k>S.ci&&k<S.co) c+=' range';
    h+='<div class="'+c+'" onclick="pick(\''+k+'\')">'+d
     + (CFG.booked.indexOf(k)>-1?'':'<span class="p">'+s.rate+'</span>')+'</div>';
  }
  h+='</div><div class="legend">'
   + '<span><i style="background:#1B2B28"></i>Selected</span>'
   + '<span><i style="background:#EAF0ED"></i>Your stay</span>'
   + '<span><i style="background:#FBF3F2"></i>Unavailable</span></div></div>';

  h+='<div class="seasons">';
  CFG.seasons.forEach(function(s){
    h+='<div class="r"><span><b>'+s.name+'</b> <em>· minimum '+s.min+' nights</em></span><b>'+f$(s.rate)+' / night</b></div>';
  });
  h+='</div>';
  return h;
}

/* ---------- RENDER ---------- */
function render(){
  var app=document.getElementById('app');

  if(S.done){
    app.innerHTML='<div class="ok"><div class="ic">✓</div><h2>Reservation confirmed</h2>'
      +'<p>A confirmation has been sent to '+eH(S.email)+'. The property will be in touch within 24 hours.</p>'
      +'<div class="ref">Reference &nbsp;·&nbsp; AUR-2026-'+Math.floor(1000+Math.random()*8999)+'</div>'
      +'<p style="margin-top:34px;font-size:12.5px">This is a demo. No payment was processed.<br>'
      +'<a href="#" onclick="location.reload();return false" style="color:#2F5D52">Start over</a></p></div>';
    return;
  }

  var titles=['Dates','Extras','Payment'], st='';
  titles.forEach(function(t,i){
    st+='<div class="step'+(S.step<i?' dim':'')+'"><div class="dot'+(S.step===i?' active':S.step>i?' done':'')+'">'
      + (S.step>i?'✓':i+1)+'</div><span class="stxt'+(S.step===i?' b':'')+'">'+t+'</span></div>';
  });

  var h='<h1>Reserve <span>'+CFG.property+'</span></h1>'
      + '<p class="sub">Select your dates, add what you need, and pay securely.</p>'
      + '<p class="note">Questions? WhatsApp +52 312 241 1693 · hello@casaaurora.com</p>'
      + '<div class="steps">'+st+'</div>';

  /* PASO 0 — FECHAS */
  if(S.step===0){
    h+=calHTML();
    h+='<div class="row2" style="margin-top:22px">'
      +'<div class="fld"><label class="lbl">Guests</label><select onchange="S.guests=+this.value">'
      + [1,2,3,4,5,6,7,8].map(function(n){return '<option value="'+n+'"'+(S.guests===n?' selected':'')+'>'+n+' guest'+(n>1?'s':'')+'</option>'}).join('')
      +'</select></div>'
      +'<div class="fld"><label class="lbl">Pets</label><select onchange="S.pets=+this.value;render()">'
      + [0,1,2].map(function(n){return '<option value="'+n+'"'+(S.pets===n?' selected':'')+'>'+(n===0?'None':n+' pet'+(n>1?'s':''))+'</option>'}).join('')
      +'</select></div></div>';

    if(S.ci&&S.co){
      h+=summaryHTML();
      if(!minOk()){
        h+='<p style="margin-top:14px;font-size:13px;color:#B5726A">Minimum stay for these dates is '
          + seasonFor(S.ci).min+' nights.</p>';
      }
    }
    h+='<div class="bn"><button class="bp'+(S.ci&&S.co&&minOk()?'':' dim')+'"'
      + (S.ci&&S.co&&minOk()?'':' disabled')+' onclick="S.step=1;render();scrollTo(0,0)">Continue</button></div>';
  }

  /* PASO 1 — EXTRAS */
  if(S.step===1){
    h+='<h2 class="eh2">Add to your stay</h2><p class="esub">Optional. Charged with your reservation.</p>';
    CFG.addons.forEach(function(a){
      var on=!!S.addons[a.id];
      var price = a.per==='night' ? f$(a.price)+' / night' : a.per==='session' ? f$(a.price)+' / session' : f$(a.price);
      h+='<div class="ex'+(on?' on':'')+'" onclick="S.addons[\''+a.id+'\']=!S.addons[\''+a.id+'\'];render()">'
        +'<div class="box">'+(on?'✓':'')+'</div>'
        +'<div class="t"><b>'+a.name+'</b><span>'+a.desc+'</span></div>'
        +'<div class="pr">'+price+'</div></div>';
    });
    h+=summaryHTML();
    h+='<div class="bn"><button class="bs" onclick="S.step=0;render();scrollTo(0,0)">Back</button>'
      +'<button class="bp" onclick="S.step=2;render();scrollTo(0,0)">Continue</button></div>';
  }

  /* PASO 2 — PAGO */
  if(S.step===2){
    h+='<h2 class="eh2">Contact &amp; payment</h2><p class="esub">Review your booking and pay securely.</p>'
      +'<div class="row2">'
      +'<div class="fld"><label class="lbl">Full name</label><input value="'+eH(S.name)+'" oninput="S.name=this.value;sync()" placeholder="Your name"></div>'
      +'<div class="fld"><label class="lbl">Email</label><input type="email" value="'+eH(S.email)+'" oninput="S.email=this.value;sync()" placeholder="you@email.com"></div></div>'
      +'<div class="fld"><label class="lbl">Phone / WhatsApp</label><input type="tel" value="'+eH(S.phone)+'" oninput="S.phone=this.value;sync()" placeholder="+52 ..."></div>'
      +'<div class="fld"><label class="lbl">Special requests</label><textarea oninput="S.notes=this.value" placeholder="Dietary needs, celebrations, arrival time...">'+eH(S.notes)+'</textarea></div>';
    h+=summaryHTML();
    h+='<label class="agree"><input type="checkbox"'+(S.agreed?' checked':'')+' onchange="S.agreed=this.checked;sync()">'
      +'<span>I have read and accept the <a href="#" onclick="return false">rental agreement and cancellation policy</a>.</span></label>';
    h+='<div class="bn"><button class="bs" onclick="S.step=1;render();scrollTo(0,0)">Back</button>'
      +'<button id="payBtn" class="bp'+(ready()?'':' dim')+'"'+(ready()?'':' disabled')+' onclick="payDemo()">Pay '+f$(total())+' USD</button></div>'
      +'<p style="margin-top:14px;font-size:12px;color:#8D9A96;text-align:center">Secured by Stripe · This demo processes no payment</p>';
  }

  h+='<p class="foot">Direct booking system by <a href="https://wdstudio.agency" target="_blank" rel="noopener">WD Studio</a><br>No platform. No commission.</p>';
  app.innerHTML=h;
}

function summaryHTML(){
  if(!S.ci||!S.co) return '';
  var n=nights(), segs=segments();
  var h='<div class="sum"><div class="sh">Your stay</div>';
  h+='<div class="r"><span>Check-in<small>'+fmt(S.ci)+'</small></span><span>Check-out<small style="text-align:right">'+fmt(S.co)+'</small></span></div>';
  segs.forEach(function(s){
    h+='<div class="r"><span>'+s.name+'<small>'+s.n+' night'+(s.n>1?'s':'')+' × '+f$(s.rate)+'</small></span><b>'+f$(s.rate*s.n)+'</b></div>';
  });
  h+='<div class="r"><span>Cleaning fee</span><b>'+f$(CFG.cleaning)+'</b></div>';
  if(S.pets>0) h+='<div class="r"><span>Pet fee<small>'+S.pets+' × '+f$(CFG.petFee)+' × '+n+' nights</small></span><b>'+f$(petsTotal())+'</b></div>';
  CFG.addons.forEach(function(a){
    if(!S.addons[a.id]) return;
    var amt = a.per==='night' ? a.price*n : a.price;
    h+='<div class="r"><span>'+a.name+(a.per==='night'?'<small>'+n+' nights × '+f$(a.price)+'</small>':'')+'</span><b>'+f$(amt)+'</b></div>';
  });
  h+='<div class="r tot"><span>Total</span><b>'+f$(total())+' USD</b></div></div>';
  return h;
}
function fmt(k){
  var d=new Date(k+'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function ready(){ return S.name.trim() && S.email.indexOf('@')>0 && S.phone.trim() && S.agreed; }
function sync(){
  var b=document.getElementById('payBtn'); if(!b) return;
  if(ready()){ b.classList.remove('dim'); b.disabled=false; } else { b.classList.add('dim'); b.disabled=true; }
}
function payDemo(){
  var b=document.getElementById('payBtn');
  b.textContent='Processing...'; b.classList.add('dim'); b.disabled=true;
  setTimeout(function(){ S.done=true; render(); scrollTo(0,0); }, 1400);
}

render();
</script>
</body>
</html>
