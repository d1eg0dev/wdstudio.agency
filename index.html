<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WD Studio Agency — Digital Solutions</title>
<meta name="description" content="Soluciones digitales personalizadas e inteligencia artificial para empresas worldwide. Chatbots IA, desarrollo web y automatización desde $333 USD.">
<style>
:root {
  --black: #000000;
  --white: #ffffff;
  --gray-50: #fafafa;
  --gray-100: #f5f5f5;
  --gray-200: #e5e5e5;
  --gray-300: #d4d4d4;
  --gray-400: #a3a3a3;
  --gray-500: #737373;
  --gray-600: #525252;
  --gray-700: #404040;
  --gray-800: #262626;
  --gray-900: #171717;
  --gray-950: #0a0a0a;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--white);
  color: var(--black);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

html[dir="rtl"] body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
html[lang="zh"] body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif; }

a { color: inherit; text-decoration: none; }

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 clamp(1.5rem, 5vw, 4rem);
}

/* ===== NAV ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  padding: 1.5rem clamp(1.5rem, 5vw, 4rem);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: transparent;
  transition: all 0.4s;
}

.nav.scrolled {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--gray-200);
  padding-top: 1rem; padding-bottom: 1rem;
}

.nav-logo img {
  height: 32px;
  width: auto;
  transition: opacity 0.4s;
}

.nav-logo .logo-light { display: block; }
.nav-logo .logo-dark { display: none; }
.nav.scrolled .nav-logo .logo-light { display: none; }
.nav.scrolled .nav-logo .logo-dark { display: block; }

.nav-right {
  display: flex;
  align-items: center;
  gap: 2rem;
}

.nav-link {
  font-size: 0.75rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
  transition: color 0.3s;
  font-weight: 500;
}

.nav.scrolled .nav-link { color: var(--gray-500); }
.nav-link:hover { color: var(--white); }
.nav.scrolled .nav-link:hover { color: var(--black); }

.nav-cta {
  font-size: 0.7rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  padding: 0.6rem 1.5rem;
  border: 1px solid rgba(255,255,255,0.3);
  color: var(--white);
  transition: all 0.3s;
}

.nav.scrolled .nav-cta { border-color: var(--black); color: var(--black); }
.nav-cta:hover { background: var(--white); color: var(--black); }
.nav.scrolled .nav-cta:hover { background: var(--black); color: var(--white); }

/* Language Switcher */
.lang-switch {
  display: flex;
  gap: 2px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 2px;
  transition: background 0.4s;
}

.nav.scrolled .lang-switch { background: var(--gray-100); }

.lang-btn {
  padding: 0.35rem 0.55rem;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  transition: all 0.3s;
  border-radius: 3px;
  font-family: inherit;
}

.nav.scrolled .lang-btn { color: var(--gray-400); }

.lang-btn.active {
  background: var(--white);
  color: var(--black);
}

.nav.scrolled .lang-btn.active {
  background: var(--black);
  color: var(--white);
}

/* ===== HERO ===== */
.hero {
  min-height: 100vh;
  background: var(--black);
  color: var(--white);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 10rem 0 8rem;
}

.hero-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: var(--gray-500);
  margin-bottom: 2.5rem;
  opacity: 0; animation: fadeIn 0.6s 0.2s forwards;
}

.hero-title {
  font-size: clamp(2.5rem, 6.5vw, 5.5rem);
  font-weight: 300;
  line-height: 1.08;
  letter-spacing: -0.03em;
  max-width: 900px;
  margin-bottom: 2.5rem;
  opacity: 0; animation: fadeIn 0.6s 0.4s forwards;
}

html[dir="rtl"] .hero-title { letter-spacing: 0; }
html[lang="zh"] .hero-title { letter-spacing: 0; }

.hero-title strong { font-weight: 700; }

.hero-sub {
  font-size: clamp(0.95rem, 1.3vw, 1.1rem);
  color: var(--gray-400);
  max-width: 480px;
  line-height: 1.7;
  font-weight: 300;
  margin-bottom: 2rem;
  opacity: 0; animation: fadeIn 0.6s 0.6s forwards;
}

.hero-price {
  font-size: 0.95rem;
  color: var(--gray-300);
  font-weight: 300;
  margin-bottom: 3rem;
  opacity: 0; animation: fadeIn 0.6s 0.7s forwards;
  letter-spacing: 0.5px;
}

.hero-price strong {
  font-weight: 700;
  color: var(--white);
  font-size: 1.1rem;
}

.hero-actions {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  opacity: 0; animation: fadeIn 0.6s 0.8s forwards;
}

/* Buttons */
.btn-white {
  display: inline-flex; align-items: center; gap: 0.6rem;
  padding: 1rem 2.2rem;
  background: var(--white); color: var(--black);
  font-size: 0.75rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1.5px;
  border: none; cursor: pointer; transition: all 0.3s;
  font-family: inherit;
}
.btn-white:hover { background: var(--gray-200); transform: translateY(-1px); }

.btn-ghost {
  display: inline-flex; align-items: center; gap: 0.6rem;
  padding: 1rem 2.2rem;
  background: transparent; color: var(--white);
  font-size: 0.75rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1.5px;
  border: 1px solid var(--gray-700); cursor: pointer; transition: all 0.3s;
  font-family: inherit;
}
.btn-ghost:hover { border-color: var(--gray-400); }

.btn-black {
  display: inline-flex; align-items: center; gap: 0.6rem;
  padding: 1rem 2.2rem;
  background: var(--black); color: var(--white);
  font-size: 0.75rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1.5px;
  border: 1px solid var(--black); cursor: pointer; transition: all 0.3s;
  font-family: inherit;
}
.btn-black:hover { background: var(--gray-800); transform: translateY(-1px); }

/* ===== METRICS ===== */
.metrics {
  padding: 5rem 0;
  border-bottom: 1px solid var(--gray-200);
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.metric {
  text-align: center;
  padding: 1.5rem;
  border-right: 1px solid var(--gray-200);
}

html[dir="rtl"] .metric { border-right: none; border-left: 1px solid var(--gray-200); }
html[dir="rtl"] .metric:last-child { border-left: none; }

.metric:last-child { border-right: none; }

.metric-value {
  font-size: 2.8rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}

.metric-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--gray-500);
  margin-top: 0.6rem;
}

/* ===== SERVICES ===== */
.services { padding: 8rem 0; }

.section-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: var(--gray-500);
  margin-bottom: 1.5rem;
  font-weight: 500;
}

.section-heading {
  font-size: clamp(1.8rem, 3.5vw, 2.8rem);
  font-weight: 300;
  line-height: 1.2;
  letter-spacing: -0.02em;
  max-width: 600px;
  margin-bottom: 4rem;
}

html[dir="rtl"] .section-heading { letter-spacing: 0; }

.section-heading strong { font-weight: 700; }

.services-list { display: flex; flex-direction: column; }

.service-row {
  display: grid;
  grid-template-columns: 80px 1fr 1fr;
  gap: 3rem;
  align-items: start;
  padding: 2.5rem 0;
  border-top: 1px solid var(--gray-200);
  transition: background 0.3s;
  cursor: default;
}

.service-row:hover {
  background: var(--gray-50);
  margin: 0 -2rem;
  padding-left: 2rem;
  padding-right: 2rem;
}

.service-num {
  font-size: 0.7rem;
  letter-spacing: 1px;
  color: var(--gray-400);
  padding-top: 0.3rem;
  font-weight: 500;
}

.service-name {
  font-size: 1.3rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.service-desc {
  font-size: 0.88rem;
  color: var(--gray-600);
  line-height: 1.7;
  font-weight: 300;
}

/* ===== AI SECTION ===== */
.ai-section {
  background: var(--gray-950);
  color: var(--white);
  padding: 8rem 0;
}

.ai-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6rem;
  align-items: start;
}

.ai-heading {
  font-size: clamp(1.8rem, 3.5vw, 2.8rem);
  font-weight: 300;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 1.5rem;
}

.ai-heading strong { font-weight: 700; }

.ai-sub {
  color: var(--gray-400);
  font-size: 0.95rem;
  line-height: 1.7;
  font-weight: 300;
  margin-bottom: 2.5rem;
}

.ai-cta-row { display: flex; gap: 1rem; flex-wrap: wrap; }

.ai-features { display: flex; flex-direction: column; }

.ai-feature {
  padding: 1.8rem 0;
  border-bottom: 1px solid var(--gray-800);
}

.ai-feature:first-child { border-top: 1px solid var(--gray-800); }

.ai-feature-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.ai-feature-title::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--white);
  border-radius: 50%;
  flex-shrink: 0;
}

.ai-feature-desc {
  font-size: 0.85rem;
  color: var(--gray-500);
  line-height: 1.6;
  font-weight: 300;
  padding-left: 1.5rem;
}

html[dir="rtl"] .ai-feature-desc { padding-left: 0; padding-right: 1.5rem; }

/* ===== PROCESS ===== */
.process {
  padding: 8rem 0;
  border-bottom: 1px solid var(--gray-200);
}

.process-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 4rem;
}

.process-step {
  padding: 2rem 2rem 2rem 0;
  border-right: 1px solid var(--gray-200);
}

html[dir="rtl"] .process-step { border-right: none; border-left: 1px solid var(--gray-200); padding: 2rem 0 2rem 2rem; }
html[dir="rtl"] .process-step:last-child { border-left: none; }

.process-step:last-child { border-right: none; }

.process-num {
  font-size: 3rem;
  font-weight: 200;
  color: var(--gray-300);
  line-height: 1;
  margin-bottom: 1.5rem;
}

.process-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0.75rem;
}

.process-desc {
  font-size: 0.83rem;
  color: var(--gray-500);
  line-height: 1.7;
  font-weight: 300;
}

/* ===== FORM ===== */
.form-section { padding: 8rem 0; }

.form-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6rem;
  align-items: start;
}

.form-info-heading {
  font-size: clamp(1.8rem, 3.5vw, 2.8rem);
  font-weight: 300;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 1.5rem;
}

.form-info-heading strong { font-weight: 700; }

.form-info-text {
  font-size: 0.95rem;
  color: var(--gray-600);
  line-height: 1.7;
  font-weight: 300;
  margin-bottom: 2.5rem;
}

.form-benefits { display: flex; flex-direction: column; gap: 1rem; }

.form-benefit {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  font-size: 0.88rem;
  color: var(--gray-600);
}

.form-benefit::before {
  content: '→';
  color: var(--black);
  font-weight: 600;
  flex-shrink: 0;
}

html[dir="rtl"] .form-benefit::before { content: '←'; }

.form-card {
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  padding: 2.5rem;
}

.form-group { margin-bottom: 1.5rem; }

.form-label {
  display: block;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--gray-500);
  margin-bottom: 0.5rem;
  font-weight: 500;
}

.form-input {
  width: 100%;
  padding: 0.85rem 0;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--gray-300);
  color: var(--black);
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 400;
  outline: none;
  transition: border-color 0.3s;
}

.form-input:focus { border-color: var(--black); }
.form-input::placeholder { color: var(--gray-400); }
select.form-input { -webkit-appearance: none; cursor: pointer; background: transparent; }
.form-input option { background: var(--white); color: var(--black); }

.form-submit {
  width: 100%;
  padding: 1.1rem;
  background: var(--black);
  color: var(--white);
  font-family: inherit;
  font-weight: 600;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 0.5rem;
}

.form-submit:hover { background: var(--gray-800); transform: translateY(-1px); }

.form-note {
  text-align: center;
  font-size: 0.7rem;
  color: var(--gray-400);
  margin-top: 1rem;
}

.form-success { display: none; text-align: center; padding: 3rem 1rem; }
.form-success.show { display: block; }
.form-success h4 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.75rem; }
.form-success p { color: var(--gray-500); font-size: 0.9rem; font-weight: 300; }

/* ===== FINAL CTA ===== */
.final-cta {
  background: var(--black);
  color: var(--white);
  padding: 8rem 0;
  text-align: center;
}

.final-heading {
  font-size: clamp(2rem, 4.5vw, 3.5rem);
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 1.5rem;
}

.final-heading strong { font-weight: 700; }

.final-sub {
  font-size: 1rem;
  color: var(--gray-400);
  max-width: 440px;
  margin: 0 auto 3rem;
  line-height: 1.7;
  font-weight: 300;
}

.final-actions {
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 2rem;
}

.final-note {
  font-size: 0.7rem;
  color: var(--gray-600);
  letter-spacing: 0.5px;
}

/* ===== FOOTER ===== */
.footer {
  padding: 3rem 0;
  border-top: 1px solid var(--gray-200);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

.footer-left { display: flex; align-items: center; gap: 2rem; }
.footer-logo img { height: 24px; width: auto; }
.footer-copy { font-size: 0.7rem; color: var(--gray-400); letter-spacing: 0.5px; }
.footer-links { display: flex; gap: 2rem; }

.footer-link {
  font-size: 0.7rem;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: color 0.3s;
  font-weight: 500;
}

.footer-link:hover { color: var(--black); }

/* ===== WHATSAPP ===== */
.wa-float {
  position: fixed;
  bottom: 2rem; right: 2rem;
  width: 56px; height: 56px;
  background: var(--black);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
  transition: all 0.3s;
  cursor: pointer;
}

html[dir="rtl"] .wa-float { right: auto; left: 2rem; }

.wa-float:hover { transform: scale(1.08); box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
.wa-float svg { width: 24px; height: 24px; fill: var(--white); }

/* ===== ANIMATIONS ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.reveal.visible { opacity: 1; transform: translateY(0); }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
  .process-grid { grid-template-columns: repeat(2, 1fr); }
  .process-step { border-bottom: 1px solid var(--gray-200); }
  .process-step:nth-child(2) { border-right: none; }
  html[dir="rtl"] .process-step:nth-child(2) { border-left: none; }
  .ai-grid { grid-template-columns: 1fr; gap: 3rem; }
  .form-wrapper { grid-template-columns: 1fr; gap: 3rem; }
}

@media (max-width: 768px) {
  .nav-right .nav-link { display: none; }
  .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  .metric { border-bottom: 1px solid var(--gray-200); }
  .service-row { grid-template-columns: 1fr; gap: 0.5rem; }
  .service-num { display: none; }
  .process-grid { grid-template-columns: 1fr; }
  .process-step { border-right: none !important; border-left: none !important; }
  .hero-actions { flex-direction: column; }
  .btn-white, .btn-ghost, .btn-black { justify-content: center; width: 100%; }
  .form-card { padding: 1.5rem; }
  .final-actions { flex-direction: column; align-items: center; }
  .lang-switch { gap: 1px; }
  .lang-btn { padding: 0.3rem 0.4rem; font-size: 0.6rem; }
}
</style>
</head>
<body>

<!-- NAV -->

let currentLang = 'es';

function setLang(lang) {
  currentLang = lang;
  const t = T[lang];
  const html = document.documentElement;

  // Set direction for Arabic
  html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  html.setAttribute('lang', lang);

  // Update active button
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');

  // Replace all data-i18n text
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.innerHTML = t[key];
  });

  // Replace placeholders
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');
    if (t[key] !== undefined) el.placeholder = t[key];
  });
}

// Init
setLang('es');

// Nav scroll
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 80);
});

// Reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// Form - sends to Google Sheets + email notification
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvFquiDvm6gmmvw_67hB9CL-2J74GJYxutFIl6rLitTMSZenMhpYTGH7nlLX7JUswYRw/exec'; // Replace after deploying the script

function submitForm() {
  const name = document.getElementById('f-name').value;
  const email = document.getElementById('f-email').value;
  const company = document.getElementById('f-company').value;
  const service = document.getElementById('f-service').value;
  const budget = document.getElementById('f-budget').value;
  const lang = currentLang;

  if (!name || !email) {
    alert(T[currentLang].form_alert);
    return;
  }

  // Disable button while sending
  const btn = document.querySelector('.form-submit');
  const originalText = btn.textContent;
  btn.textContent = '...';
  btn.disabled = true;

  // Send to Google Apps Script
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email, company, service, budget, lang, timestamp: new Date().toISOString() })
  })
  .then(() => {
    document.getElementById('formFields').style.display = 'none';
    document.getElementById('formSuccess').classList.add('show');
    setTimeout(() => { window.open('https://wa.link/hf8ufv', '_blank'); }, 2000);
  })
  .catch(() => {
    // Even if fetch fails with no-cors, data was sent
    document.getElementById('formFields').style.display = 'none';
    document.getElementById('formSuccess').classList.add('show');
    setTimeout(() => { window.open('https://wa.link/hf8ufv', '_blank'); }, 2000);
  });
}

// Smooth scroll
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', function(e) {
    e.preventDefault();
    const t = document.querySelector(this.getAttribute('href'));
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});
